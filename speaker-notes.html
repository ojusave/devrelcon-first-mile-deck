<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>DevRelCon speaker notes</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --ink: #0b1b2a;
        --panel: #12283c;
        --line: #38506a;
        --text: #f7f3e8;
        --muted: #a9b7ca;
        --signal: #ff8a66;
        --sky: #14b8f1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ink);
        color: var(--text);
      }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto minmax(108px, auto) minmax(0, 1fr) minmax(108px, auto) auto;
        gap: 10px;
        width: min(920px, 100%);
        height: 100vh;
        margin: 0 auto;
        padding: 18px;
        overflow: hidden;
      }

      header,
      section {
        border: 2px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 20px;
        grid-column: 1 / -1;
      }

      h1,
      h2,
      p { margin: 0; }

      h1 { font-size: clamp(28px, 5vw, 44px); }
      h2 { color: var(--sky); font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
      p { font-size: clamp(18px, 2vw, 23px); line-height: 1.35; }

      .status { color: var(--muted); font-size: 15px; }
      .slide-number { color: var(--signal); }

      section {
        display: grid;
        align-content: start;
        gap: 8px;
        padding: 16px 20px;
        min-height: 0;
      }

      .purpose { grid-column: 1; grid-row: 2; }
      .transition { grid-column: 2; grid-row: 2; border-color: var(--signal); }
      .talking-points {
        grid-column: 1 / -1;
        grid-row: 3;
        grid-template-rows: auto minmax(0, 1fr);
        align-content: stretch;
      }
      .watch { grid-column: 1; grid-row: 4; border-color: var(--sky); }
      .fallback { grid-column: 2; grid-row: 4; border-color: var(--signal); }

      textarea {
        width: 100%;
        min-height: 0;
        resize: none;
        border: 0;
        padding: 0;
        overflow-y: auto;
        scrollbar-color: var(--sky) transparent;
        scrollbar-width: thin;
        color: var(--text);
        background: transparent;
        font: inherit;
        line-height: 1.35;
      }

      textarea::-webkit-scrollbar { width: 8px; }
      textarea::-webkit-scrollbar-track { background: transparent; }
      textarea::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: var(--sky);
      }

      textarea:focus-visible {
        outline: 3px solid var(--sky);
        outline-offset: 4px;
      }

      .purpose textarea,
      .transition textarea,
      .watch textarea,
      .fallback textarea { height: 58px; }
      .talking-points textarea { height: auto; font-size: clamp(17px, 1.75vw, 21px); }

      nav {
        display: grid;
        grid-column: 1 / -1;
        grid-row: 5;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 14px;
      }

      button {
        min-height: 52px;
        border: 2px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        background: #1b3853;
        font: 700 18px inherit;
        cursor: pointer;
      }

      button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
      .save { border-color: var(--sky); background: #0d5873; }
      .reset { border-color: var(--signal); background: #512d35; }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto minmax(240px, 1fr) auto auto auto auto;
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }

        header { grid-column: 1; grid-row: 1; }
        .purpose { grid-column: 1; grid-row: 2; }
        .talking-points { grid-column: 1; grid-row: 3; }
        .transition { grid-column: 1; grid-row: 4; }
        .watch { grid-column: 1; grid-row: 5; }
        .fallback { grid-column: 1; grid-row: 6; }
        nav { grid-column: 1; grid-row: 7; }

        .purpose textarea,
        .transition textarea,
        .watch textarea,
        .fallback textarea { height: 92px; }

        nav { grid-template-columns: 1fr 1fr; }
      }
    </style>
    <script defer src="config.js?v=9"></script>
    <script defer src="speaker-notes.js?v=7"></script>
    <script defer src="speaker-notes-view.js?v=6"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="status">SPEAKER NOTES</p>
          <h1>Slide <span class="slide-number" data-note-slide>1</span></h1>
        </div>
        <div>
          <p class="status" data-note-status role="status" aria-live="polite">Waiting for deck</p>
          <p class="status">Edits are stored in this browser.</p>
        </div>
      </header>
      <section class="purpose">
        <h2 id="purpose-label">Purpose</h2>
        <textarea data-note-purpose aria-labelledby="purpose-label" spellcheck="true"></textarea>
      </section>
      <section class="talking-points">
        <h2 id="talking-points-label">Talking points</h2>
        <textarea data-note-say aria-labelledby="talking-points-label" spellcheck="true"></textarea>
      </section>
      <section class="transition">
        <h2 id="transition-label">Transition</h2>
        <textarea data-note-transition aria-labelledby="transition-label" spellcheck="true"></textarea>
      </section>
      <section class="watch">
        <h2 id="watch-label">Timing and room cue</h2>
        <textarea data-note-watch aria-labelledby="watch-label" spellcheck="true"></textarea>
      </section>
      <section class="fallback">
        <h2 id="fallback-label">Fallback</h2>
        <textarea data-note-fallback aria-labelledby="fallback-label" spellcheck="true"></textarea>
      </section>
      <nav aria-label="Slide controls">
        <button type="button" data-note-previous>Previous</button>
        <button class="save" type="button" data-note-save>Save notes</button>
        <button class="reset" type="button" data-note-reset>Restore defaults</button>
        <button type="button" data-note-next>Next</button>
      </nav>
    </main>
  </body>
</html>
